# Render Blueprint for the ASTRA coach proxy (free plan, no credit card).
# Steps: services/coach-proxy/deploy/README.md
#
# The service runs from the repository root because the proxy reads the mission files
# (Assets/ASTRA/Content/Missions) and fixtures (fixtures/) by repo-relative path.
# Secrets are never stored here: GEMINI_API_KEY is "sync: false", so Render asks for it
# in the dashboard and only the team lead types it in.
services:
  - type: web
    name: astra-coach-proxy
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildFilter:
      paths:
        - services/coach-proxy/**
        - Assets/ASTRA/Content/Missions/**
        - fixtures/**
    buildCommand: pip install -r services/coach-proxy/requirements.txt
    # --proxy-headers: Render's load balancer sits in front, so the per-IP rate limit must use
    # the client address from X-Forwarded-For (otherwise every user shares one 10/min bucket).
    startCommand: cd services/coach-proxy && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: USE_MOCK_AI
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: COACH_ALLOWED_ORIGIN
        value: https://dhruvsharma06-web.github.io
      - key: RATE_LIMIT_PER_MIN
        value: "10"
      - key: AI_TIMEOUT_MS
        value: "6000"
