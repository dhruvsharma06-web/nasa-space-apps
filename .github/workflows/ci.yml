name: CI

# Runs on every pull request and on pushes to main. No Unity here: Unity tests are run
# locally before each merge (see README "Run it yourself"); results go in the PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content validator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate missions, layouts and fixtures
        run: python scripts/validate_content.py

  scoring:
    name: Scoring + offline coach tests (level-sim)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reference scoring tests
        run: node tools/level-sim/test_scoring.mjs
      # Instructor dashboard tests (P2). Runs automatically once the file exists.
      - name: Instructor dashboard tests
        run: |
          if [ -f tools/instructor-dashboard/test.mjs ]; then
            node tools/instructor-dashboard/test.mjs
          else
            echo "tools/instructor-dashboard/test.mjs not in this branch yet: skipped"
          fi

  coach-proxy:
    name: Coach proxy tests (mock mode, no key)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/coach-proxy
    env:
      # Never give CI a real key: the tests use mock mode and fakes only.
      USE_MOCK_AI: "true"
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/coach-proxy/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
